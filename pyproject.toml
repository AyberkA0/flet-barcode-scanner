[project]
name = "flet-barcode-scanner"
version = "0.2.0"
description = "BarcodeScanner control for Flet — full-screen QR/barcode scanning."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AyberkA0", email = "ayberkatalaybusiness@gmail.com" }
]
dependencies = [
    "flet>=0.86.5",
]

[project.urls]
Homepage = "https://github.com/AyberkA0/flet-barcode-scanner"
Documentation = "https://github.com/AyberkA0/flet-barcode-scanner"
Repository = "https://github.com/AyberkA0/flet-barcode-scanner"
Issues = "https://github.com/AyberkA0/flet-barcode-scanner/issues"

[tool.setuptools.package-data]
"flutter.flet_barcode_scanner" = ["pubspec.yaml", "lib/**"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
