[project]
name = "flet-barcode-scanner-example"
version = "0.1.0"
description = "Example app for the flet-barcode-scanner extension."
requires-python = ">=3.10"
dependencies = [
    "flet>=0.86.5",
    "flet-barcode-scanner @ file://../../",
]

[tool.flet]
org = "dev.example"
product = "Flet Barcode Scanner Example"
permissions = ["camera"]

[tool.flet.app]
path = "src"
